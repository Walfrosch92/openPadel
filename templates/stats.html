<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="stats.title">Match-Statistiken</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #fff;
        }
        .nav {
            background: rgba(0, 0, 0, 0.3);
            padding: 10px;
            text-align: center;
        }
        .nav a {
            color: #fff;
            text-decoration: none;
            margin: 0 10px;
            padding: 8px 15px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            font-size: 14px;
        }
        .nav a:hover {
            background: rgba(255, 255, 255, 0.3);
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }
        .stats-container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }
        .stats-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .stats-header h2 {
            color: #333;
            font-size: 1.8em;
        }
        .btn {
            padding: 12px 25px;
            font-size: 1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
        }
        .btn-danger {
            background: #dc3545;
            color: white;
        }
        .btn-danger:hover {
            background: #c82333;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(220, 53, 69, 0.4);
        }
        .btn-danger:active {
            transform: scale(0.95);
        }
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            color: white;
        }
        .summary-card .value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .summary-card .label {
            font-size: 1em;
            opacity: 0.9;
        }
        .matches-table-container {
            overflow-x: auto;
        }
        .matches-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        .matches-table thead {
            background: #667eea;
            color: white;
        }
        .matches-table th {
            padding: 15px;
            text-align: left;
            font-weight: bold;
            font-size: 1em;
        }
        .matches-table td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            color: #333;
        }
        .matches-table tbody tr {
            transition: background 0.3s;
        }
        .matches-table tbody tr:hover {
            background: #f8f9fa;
        }
        .winner-badge {
            display: inline-block;
            padding: 5px 12px;
            background: #28a745;
            color: white;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
        }
        .delete-btn {
            padding: 8px 15px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: bold;
            transition: all 0.3s;
        }
        .delete-btn:hover {
            background: #c82333;
            transform: scale(1.05);
        }
        .delete-btn:active {
            transform: scale(0.95);
        }
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }
        .empty-state-icon {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.3;
        }
        .empty-state h3 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .empty-state p {
            font-size: 1em;
        }
        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
            display: none;
        }
        .status-success {
            background: #d4edda;
            color: #155724;
        }
        .status-error {
            background: #f8d7da;
            color: #721c24;
        }
        @media (max-width: 768px) {
            .stats-header {
                flex-direction: column;
                align-items: stretch;
            }
            .matches-table {
                font-size: 0.9em;
            }
            .matches-table th,
            .matches-table td {
                padding: 10px;
            }
        }
    </style>
    <script src="/static/js/i18n.js"></script>
</head>
<body>
    <nav class="nav">
        <a href="/" data-i18n="nav.scoreboard">Scoreboard</a>
        <a href="/webcam" data-i18n="nav.camera">Kamera</a>
        <a href="/stats" data-i18n="nav.stats">Statistik</a>
        <a href="/settings" data-i18n="nav.settings">Einstellungen</a>
        <a href="/admin" data-i18n="nav.admin">Admin</a>
    </nav>

    <div class="container">
        <h1 data-i18n="stats.title">Match-Statistiken</h1>

        <div class="stats-container">
            <div class="stats-header">
                <h2 data-i18n="stats.match_history">Match-Historie</h2>
                <button class="btn btn-danger" id="clear-all-btn" onclick="clearAllMatches()" data-i18n="stats.clear_all">
                    Alle Matches löschen
                </button>
            </div>

            <div id="status-message" class="status-message"></div>

            <div class="stats-summary" id="stats-summary">
                <div class="summary-card">
                    <div class="value" id="total-matches">0</div>
                    <div class="label" data-i18n="stats.played_matches">Gespielte Matches</div>
                </div>
                <div class="summary-card">
                    <div class="value" id="total-sets">0</div>
                    <div class="label" data-i18n="stats.played_sets">Gespielte Sätze</div>
                </div>
                <div class="summary-card">
                    <div class="value" id="avg-duration">0m</div>
                    <div class="label" data-i18n="stats.avg_duration">Ø Spieldauer</div>
                </div>
            </div>

            <div class="matches-table-container">
                <table class="matches-table" id="matches-table">
                    <thead>
                        <tr>
                            <th data-i18n="stats.date">Datum</th>
                            <th data-i18n="stats.team_a">Team A</th>
                            <th data-i18n="stats.team_b">Team B</th>
                            <th data-i18n="stats.result">Ergebnis</th>
                            <th data-i18n="stats.game_mode">Modus</th>
                            <th data-i18n="stats.best_of">Best of</th>
                            <th data-i18n="stats.duration">Dauer</th>
                            <th data-i18n="stats.winner">Gewinner</th>
                            <th data-i18n="stats.action">Aktion</th>
                        </tr>
                    </thead>
                    <tbody id="matches-tbody">
                    </tbody>
                </table>
                
                <div class="empty-state" id="empty-state" style="display: none;">
                    <div class="empty-state-icon">🎾</div>
                    <h3 data-i18n="stats.no_matches">Keine Matches vorhanden</h3>
                    <p data-i18n="stats.no_matches_text">Spielen Sie Ihr erstes Match, um Statistiken zu sehen!</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let gameModes = {};

        async function loadGameModes() {
            try {
                const response = await fetch('/api/game-modes');
                const modes = await response.json();
                modes.forEach(mode => {
                    gameModes[mode.id] = mode.name;
                });
            } catch (error) {
                console.error('Error loading game modes:', error);
            }
        }

        async function loadMatches() {
            try {
                const response = await fetch('/api/history');
                const data = await response.json();

                if (!data.matches || data.matches.length === 0) {
                    document.getElementById('empty-state').style.display = 'block';
                    document.getElementById('matches-table').style.display = 'none';
                    updateSummary([]);
                    return;
                }

                document.getElementById('empty-state').style.display = 'none';
                document.getElementById('matches-table').style.display = 'table';

                const tbody = document.getElementById('matches-tbody');
                tbody.innerHTML = '';

                data.matches.forEach(match => {
                    const row = document.createElement('tr');
                    
                    // Datum aus verschiedenen Feldern extrahieren
                    const dateString = match.match_end_time || match.timestamp || match.date;
                    let dateStr = 'Unbekannt';
                    if (dateString) {
                        try {
                            const date = new Date(dateString);
                            if (!isNaN(date.getTime())) {
                                dateStr = date.toLocaleDateString('de-DE', {
                                    day: '2-digit',
                                    month: '2-digit',
                                    year: 'numeric',
                                    hour: '2-digit',
                                    minute: '2-digit'
                                });
                            }
                        } catch (e) {
                            console.error('Fehler beim Parsen des Datums:', e);
                        }
                    }

                    const result = formatResult(match);
                    
                    // Gewinner bestimmen - unterstützt verschiedene Formate
                    let winnerName = 'Unbekannt';
                    if (match.winner === 'a' || match.winner === 'team_a') {
                        winnerName = match.team_a_name || match.player1_name || 'Team A';
                    } else if (match.winner === 'b' || match.winner === 'team_b') {
                        winnerName = match.team_b_name || match.player2_name || 'Team B';
                    } else if (match.winner) {
                        // Wenn winner direkt ein Name ist
                        winnerName = match.winner;
                    }

                    const teamAName = match.team_a_name || match.player1_name || 'Team A';
                    const teamBName = match.team_b_name || match.player2_name || 'Team B';

                    // Game Mode Name
                    const gameModeId = match.game_mode || 'mit_vorteil_tiebreak';
                    const gameModeName = gameModes[gameModeId] || gameModeId;

                    // Best of berechnen
                    const setsToWin = match.sets_to_win || 2;
                    const bestOf = (setsToWin * 2) - 1;

                    // Spielzeit formatieren
                    let durationStr = '-';
                    if (match.statistics && match.statistics.duration_minutes > 0) {
                        const minutes = match.statistics.duration_minutes;
                        if (minutes >= 60) {
                            const hours = Math.floor(minutes / 60);
                            const mins = minutes % 60;
                            durationStr = `${hours}h ${mins}m`;
                        } else {
                            durationStr = `${minutes}m`;
                        }
                    }

                    row.innerHTML = `
                        <td>${dateStr}</td>
                        <td>${teamAName}</td>
                        <td>${teamBName}</td>
                        <td>${result}</td>
                        <td>${gameModeName}</td>
                        <td>${bestOf}</td>
                        <td>${durationStr}</td>
                        <td><span class="winner-badge">${winnerName}</span></td>
                        <td><button class="delete-btn" onclick="deleteMatch('${match.id}')" data-i18n="stats.delete">Löschen</button></td>
                    `;
                    tbody.appendChild(row);
                });

                updateSummary(data.matches);
            } catch (error) {
                console.error('Error loading matches:', error);
                showStatus('Fehler beim Laden der Matches', 'error');
            }
        }

        function formatResult(match) {
            if (match.set_history && match.set_history.length > 0) {
                return match.set_history.map(set => `${set[0]}-${set[1]}`).join(', ');
            }
            // Unterstütze verschiedene Feldnamen
            const setsA = match.sets_a || match.player1_sets || 0;
            const setsB = match.sets_b || match.player2_sets || 0;
            return `${setsA}-${setsB}`;
        }

        function updateSummary(matches) {
            document.getElementById('total-matches').textContent = matches.length;

            let totalSets = 0;
            let totalDuration = 0;
            let matchesWithDuration = 0;
            
            matches.forEach(match => {
                if (match.set_history) {
                    totalSets += match.set_history.length;
                } else {
                    totalSets += (match.sets_a || 0) + (match.sets_b || 0);
                }
                
                // Berechne Dauer aus Statistiken
                if (match.statistics && match.statistics.duration_minutes > 0) {
                    totalDuration += match.statistics.duration_minutes;
                    matchesWithDuration++;
                }
            });
            
            document.getElementById('total-sets').textContent = totalSets;
            
            const avgDuration = matchesWithDuration > 0
                ? Math.round(totalDuration / matchesWithDuration)
                : 0;
            document.getElementById('avg-duration').textContent = avgDuration > 0 ? `${avgDuration}m` : '0m';
        }

        async function deleteMatch(matchId) {
            if (!confirm('Möchten Sie dieses Match wirklich löschen?')) {
                return;
            }

            try {
                const response = await fetch(`/api/history/${matchId}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    showStatus('Match gelöscht', 'success');
                    loadMatches();
                } else {
                    showStatus('Fehler beim Löschen', 'error');
                }
            } catch (error) {
                console.error('Error deleting match:', error);
                showStatus('Fehler beim Löschen des Matches', 'error');
            }
        }

        async function clearAllMatches() {
            if (!confirm('Möchten Sie wirklich ALLE Matches löschen? Diese Aktion kann nicht rückgängig gemacht werden!')) {
                return;
            }

            try {
                const response = await fetch('/api/history', {
                    method: 'DELETE'
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    showStatus('Alle Matches gelöscht', 'success');
                    loadMatches();
                } else {
                    showStatus('Fehler beim Löschen', 'error');
                }
            } catch (error) {
                console.error('Error clearing matches:', error);
                showStatus('Fehler beim Löschen aller Matches', 'error');
            }
        }

        function showStatus(message, type) {
            const statusMsg = document.getElementById('status-message');
            statusMsg.textContent = message;
            statusMsg.className = 'status-message status-' + type;
            statusMsg.style.display = 'block';
            setTimeout(() => {
                statusMsg.style.display = 'none';
            }, 3000);
        }

        loadGameModes().then(() => {
            loadMatches();
            setInterval(loadMatches, 10000);
        });
    </script>
</body>
</html>
