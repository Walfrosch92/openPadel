<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <title>{{ t.nav.stats }} · openPadel</title>
{% include "_head.html" %}
</head>
<body>
{% include "_nav.html" %}

    <main class="page narrow">
        <div id="status-message" class="status-message"></div>

        <div id="stats-empty" class="empty-state hidden">
            <div class="trophy"><svg class="icon"><use href="#i-trophy"/></svg></div>
            <h3 data-i18n="stats.no_matches">Keine Matches vorhanden</h3>
            <p data-i18n="stats.no_matches_text">Spielen Sie Ihr erstes Match, um Statistiken zu sehen!</p>
        </div>

        <div id="stats-content" class="hidden">
            <h2 class="section-title" data-i18n="stats.overview">Übersicht</h2>
            <div class="stat-grid" id="overview"></div>

            <div id="game-stats-section">
                <h2 class="section-title" data-i18n="stats.game_stats">Spiel-Statistiken</h2>
                <div class="stat-grid" id="game-stats"></div>
            </div>

            <div class="card" id="insights-section" style="margin-top: 26px;">
                <div class="card-title" style="margin-bottom: 2px;">
                    <svg class="icon" style="color: var(--accent-gold);"><use href="#i-insights"/></svg>
                    <span data-i18n="stats.insights_title">Spielverlauf-Statistik</span>
                </div>
                <p class="muted small" id="insights-based-on" style="margin-bottom: 14px;"></p>
                <div class="figures" id="insights"></div>
            </div>

            <h2 class="section-title" data-i18n="stats.teams_title">Teams</h2>
            <div class="card">
                <div id="teams"></div>
                <button class="link-btn hidden" id="teams-toggle"></button>
            </div>
            <div class="card" id="h2h-card">
                <div class="card-title" data-i18n="stats.h2h_title">Direkter Vergleich</div>
                <div class="h2h">
                    <select id="h2h-x" aria-label="Team 1"></select>
                    <span class="muted small">VS</span>
                    <select id="h2h-y" aria-label="Team 2"></select>
                </div>
                <div id="h2h-result"></div>
            </div>

            <div class="section-head">
                <h2 class="section-title" data-i18n="stats.match_history">Match-Verlauf</h2>
                <button class="icon-btn danger" id="clear-all-btn" data-i18n-title="stats.clear_all" title="Alle Matches löschen">
                    <svg class="icon"><use href="#i-trash"/></svg>
                </button>
            </div>
            <div class="filter-bar">
                <div class="segmented" id="filter-range">
                    <button class="active" data-range="all" data-i18n="stats.filter_all">Alle</button>
                    <button data-range="week" data-i18n="stats.filter_week">7 Tage</button>
                    <button data-range="month" data-i18n="stats.filter_month">30 Tage</button>
                    <button data-range="year" data-i18n="stats.filter_year">12 Monate</button>
                </div>
                <input type="search" id="filter-search" placeholder="Team suchen …" data-i18n-placeholder="stats.filter_search">
            </div>
            <div id="history"></div>
            <p class="muted center hidden" id="history-empty" style="padding: 24px 0;" data-i18n="stats.filter_empty">Keine Matches für diesen Filter.</p>
        </div>
    </main>

    <div class="overlay" id="detail-overlay">
        <div class="dialog wide">
            <div class="detail-head">
                <h3 data-i18n="stats.detail_title">Match-Details</h3>
                <button class="icon-btn" id="detail-close" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button>
            </div>
            <div id="detail-body"></div>
        </div>
    </div>

    <script src="/static/js/stats.js?v={{ asset_version }}"></script>
    <script src="/static/js/shutdown.js?v={{ asset_version }}"></script>
</body>
</html>
