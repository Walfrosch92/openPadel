<script>
    /* Icon aus dem Sprite – für per JavaScript erzeugtes HTML */
    function icon(name, cls) {
        return `<svg class="icon ${cls || ''}"><use href="#i-${name}"/></svg>`;
    }
    /* Bestätigungsdialog im App-Stil. Liefert ein Promise<boolean>. */
    function confirmDialog(title, message, okLabel, danger) {
        return new Promise(resolve => {
            const overlay = document.createElement('div');
            overlay.className = 'overlay show';
            overlay.innerHTML = `
                <div class="dialog" role="dialog" aria-modal="true">
                    <h3>${esc(title)}</h3>
                    <p>${esc(message || '')}</p>
                    <div class="btn-row">
                        <button class="btn btn-ghost" data-answer="no">${esc(tr('common.cancel', 'Abbrechen'))}</button>
                        <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-answer="yes">${esc(okLabel || 'OK')}</button>
                    </div>
                </div>`;
            overlay.addEventListener('click', e => {
                const answer = e.target.closest('[data-answer]');
                if (!answer && e.target !== overlay) return;
                overlay.remove();
                resolve(!!answer && answer.dataset.answer === 'yes');
            });
            document.body.appendChild(overlay);
        });
    }
    /* Text sicher in HTML einsetzen (Team-Namen kommen von Benutzern) */
    function esc(value) {
        return String(value ?? '').replace(/[&<>"']/g, c =>
            ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
    }
</script>
