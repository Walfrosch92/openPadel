<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <title>{{ t.app_title }}</title>
{% include "_head.html" %}
</head>
<body>
{% include "_nav.html" %}

    <div class="court-lines"></div>
    <main class="page board">
        <div class="board-top">
            <span class="pill live" id="live-pill"><span class="blink"></span><span data-i18n="scoreboard.live">LIVE</span></span>
            <span class="pill" id="set-pill"></span>
            <span class="spacer"></span>
            <span class="pill" id="game-mode-display"></span>
            <span class="pill">Best of <span id="best-of-display">3</span></span>
        </div>

        <div class="teams">
            <div class="team a" id="team-a-row">
                <div class="info">
                    <div class="name"><span id="team-a-name">{{ team_a_display }}</span><span class="ball"></span></div>
                    <div class="meta" id="team-a-meta"></div>
                </div>
                <div class="sets" id="team-a-sets"></div>
                <div class="pts" id="team-a-points">0</div>
            </div>

            <div class="divider">
                <div class="ln"></div>
                <div class="vs" id="vs-label">VS</div>
                <span class="pill gold hidden" id="tiebreak-pill">★ <span data-i18n="scoreboard.tiebreak">TIEBREAK</span></span>
                <div class="ln"></div>
            </div>

            <div class="team b" id="team-b-row">
                <div class="info">
                    <div class="name"><span id="team-b-name">{{ team_b_display }}</span><span class="ball"></span></div>
                    <div class="meta" id="team-b-meta"></div>
                </div>
                <div class="sets" id="team-b-sets"></div>
                <div class="pts" id="team-b-points">0</div>
            </div>
        </div>

        <div class="controls" id="point-controls">
            <button class="pbtn a" onclick="addPoint('a')">
                <svg class="icon"><use href="#i-up"/></svg>
                <span class="lbl" id="btn-team-a">{{ team_a_display }}</span>
            </button>
            <button class="pbtn undo" onclick="undoPoint()">
                <svg class="icon"><use href="#i-undo"/></svg>
                <span class="lbl" data-i18n="scoreboard.undo">{{ t.scoreboard.undo }}</span>
            </button>
            <button class="pbtn b" onclick="addPoint('b')">
                <svg class="icon"><use href="#i-down"/></svg>
                <span class="lbl" id="btn-team-b">{{ team_b_display }}</span>
            </button>
        </div>

        <div class="controls hidden" id="new-match-controls">
            <button class="btn btn-ghost" style="flex: 1;" onclick="undoPoint()">
                <svg class="icon"><use href="#i-undo"/></svg>
                <span data-i18n="scoreboard.undo_match_end">Spielende rückgängig</span>
            </button>
            <button class="btn btn-primary" style="flex: 2;" onclick="startNewMatch()">
                <svg class="icon"><use href="#i-ball"/></svg>
                <span data-i18n="scoreboard.new_match">Neues Match</span>
            </button>
        </div>

        <div class="footer-actions" id="footer-actions">
            <button onclick="endMatch()"><svg class="icon"><use href="#i-flag"/></svg><span data-i18n="scoreboard.end_match">Match beenden</span></button>
            <button onclick="resetMatch()"><svg class="icon"><use href="#i-refresh"/></svg><span data-i18n="scoreboard.reset">Zurücksetzen</span></button>
        </div>
    </main>

    <img id="scoreboard-cam" class="scoreboard-cam" alt="cam">

    <div class="overlay" id="match-end-modal">
        <div class="dialog">
            <div class="trophy"><svg class="icon"><use href="#i-trophy"/></svg></div>
            <div class="win-cap" id="win-cap">Match gewonnen</div>
            <div class="win-team" id="winner-text"></div>
            <div class="win-score" id="win-score"></div>
            <button class="btn btn-primary block" onclick="startNewMatch()">
                <svg class="icon"><use href="#i-ball"/></svg>
                <span data-i18n="scoreboard.new_match">Neues Match</span>
            </button>
            <button class="btn btn-ghost block" onclick="closeModal(); undoPoint();" data-i18n="scoreboard.undo_match_end">Spielende rückgängig</button>
            <button class="btn btn-ghost block" onclick="closeModal()" data-i18n="scoreboard.close">Schließen</button>
        </div>
    </div>

    <script>
        let currentState = {{ state | tojson }};
        let lastMatchOver = currentState.match_over || false;
        let gameModes = {};

        async function loadGameModes() {
            try {
                const response = await fetch('/api/game-modes');
                const modes = await response.json();
                modes.forEach(mode => { gameModes[mode.id] = mode.name; });
                updateGameInfo(currentState);
            } catch (error) {
                console.error('Error loading game modes:', error);
            }
        }

        function updateGameInfo(state) {
            document.getElementById('game-mode-display').textContent =
                gameModes[state.game_mode] || state.game_mode || '';
            document.getElementById('best-of-display').textContent = state.best_of || 3;
        }

        // Satz-Kästchen: abgeschlossene Sätze + der laufende Satz (gestrichelt)
        function renderSets(state, side) {
            const index = side === 'a' ? 0 : 1;
            const boxes = (state.set_history || []).map(set => {
                const won = set[index] > set[1 - index];
                return `<div class="setbox${won ? ' win' : ''}">${set[index]}</div>`;
            });
            if (!state.match_over) {
                boxes.push(`<div class="setbox current">${side === 'a' ? state.games_a : state.games_b}</div>`);
            }
            document.getElementById(`team-${side}-sets`).innerHTML = boxes.join('');
        }

        function updateScoreboard(state) {
            currentState = state;
            const nameA = state.team_a_name || 'Team A';
            const nameB = state.team_b_name || 'Team B';

            document.getElementById('team-a-name').textContent = nameA;
            document.getElementById('team-b-name').textContent = nameB;
            document.getElementById('btn-team-a').textContent = nameA;
            document.getElementById('btn-team-b').textContent = nameB;

            // Punkte kommen fertig formatiert vom Backend (0, 15, 30, 40, AD / Tie-Break)
            document.getElementById('team-a-points').textContent = state.points_a_display;
            document.getElementById('team-b-points').textContent = state.points_b_display;

            const serving = tr('scoreboard.serving', 'Aufschlag');
            const running = !state.match_over;
            document.getElementById('team-a-row').classList.toggle('serving', running && state.serve === 'a');
            document.getElementById('team-b-row').classList.toggle('serving', running && state.serve === 'b');
            document.getElementById('team-a-meta').textContent = running && state.serve === 'a' ? serving : '';
            document.getElementById('team-b-meta').textContent = running && state.serve === 'b' ? serving : '';

            renderSets(state, 'a');
            renderSets(state, 'b');
            updateGameInfo(state);

            document.getElementById('live-pill').classList.toggle('hidden', !running);
            document.getElementById('set-pill').textContent = running
                ? `${tr('scoreboard.set', 'Satz')} ${state.current_set || 1}`
                : tr('scoreboard.match_ended', 'Match beendet');
            const tiebreak = running && state.in_tiebreak;
            document.getElementById('tiebreak-pill').classList.toggle('hidden', !tiebreak);
            document.getElementById('vs-label').classList.toggle('hidden', tiebreak);

            document.getElementById('point-controls').classList.toggle('hidden', !running);
            document.getElementById('footer-actions').classList.toggle('hidden', !running);
            document.getElementById('new-match-controls').classList.toggle('hidden', running);

            // Sieg-Overlay nur beim Übergang laufend -> beendet
            if (!lastMatchOver && state.match_over) {
                showMatchEndModal(state);
            } else if (lastMatchOver && !state.match_over) {
                closeModal();
            }
            lastMatchOver = state.match_over;
        }

        async function post(url, body) {
            const response = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: body ? JSON.stringify(body) : undefined
            });
            return response.json();
        }

        async function addPoint(team) {
            try {
                const data = await post('/api/point', {team: team});
                if (data.state) updateScoreboard(data.state);
            } catch (error) {
                console.error('Error adding point:', error);
            }
        }

        async function undoPoint() {
            try {
                const data = await post('/api/undo');
                if (data.state) updateScoreboard(data.state);
            } catch (error) {
                console.error('Error undoing point:', error);
            }
        }

        async function fetchState() {
            try {
                const response = await fetch('/api/state');
                const data = await response.json();
                if (data.state) updateScoreboard(data.state);
            } catch (error) {
                console.error('Error fetching state:', error);
            }
        }

        async function endMatch() {
            const ok = await confirmDialog(
                tr('scoreboard.end_match', 'Match beenden') + '?',
                tr('scoreboard.end_match_message', 'Das Match wird mit dem aktuellen Stand in der Statistik gespeichert.'),
                tr('scoreboard.end_match', 'Match beenden'));
            if (!ok) return;
            try {
                const data = await post('/api/match/save-to-history');
                if (data.state) updateScoreboard(data.state);
            } catch (error) {
                console.error('Error ending match:', error);
            }
        }

        async function resetMatch() {
            const ok = await confirmDialog(
                tr('scoreboard.reset_title', 'Match zurücksetzen?'),
                tr('scoreboard.reset_message', 'Der Spielstand wird auf 0:0 zurückgesetzt.'),
                tr('scoreboard.reset', 'Zurücksetzen'), true);
            if (!ok) return;
            try {
                await post('/api/reset');
                fetchState();
            } catch (error) {
                console.error('Error resetting match:', error);
            }
        }

        async function startNewMatch() {
            try {
                const data = await post('/api/new-match');
                if (data.state) {
                    closeModal();
                    lastMatchOver = false;
                    updateScoreboard(data.state);
                }
            } catch (error) {
                console.error('Error starting new match:', error);
            }
        }

        function showMatchEndModal(state) {
            const winner = state.winner === 'a' ? state.team_a_name
                : state.winner === 'b' ? state.team_b_name : null;
            document.getElementById('win-cap').textContent = winner
                ? tr('scoreboard.match_won', 'Match gewonnen')
                : tr('scoreboard.match_ended', 'Match beendet');
            document.getElementById('winner-text').textContent =
                winner || tr('scoreboard.draw', 'Unentschieden!');
            document.getElementById('win-score').innerHTML = (state.set_history || []).map((set, i) => `
                <div class="s ${set[0] > set[1] ? 'a' : set[1] > set[0] ? 'b' : ''}">
                    <small>${esc(tr('scoreboard.set', 'Satz'))} ${i + 1}</small>
                    <b>${set[0]}:${set[1]}</b>
                </div>`).join('');
            document.getElementById('match-end-modal').classList.add('show');
            if (winner) launchConfetti();
        }

        function closeModal() {
            document.getElementById('match-end-modal').classList.remove('show');
        }

        function launchConfetti() {
            const colors = ['#0A84FF', '#BF5AF2', '#FFD66B', '#39E07A', '#FFFFFF'];
            for (let i = 0; i < 120; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[i % colors.length];
                    confetti.style.animationDuration = (Math.random() * 2 + 2.2) + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 4500);
                }, i * 25);
            }
        }

        updateScoreboard(currentState);
        loadGameModes();
        setInterval(fetchState, 1000);

        // Kamera-Vorschau nur bei aktiver Gestenerkennung (Stream erst dann laden)
        async function updateCamPreview() {
            try {
                const r = await fetch('/api/webcam/settings');
                const d = await r.json();
                const cam = document.getElementById('scoreboard-cam');
                const active = d.gesture_recognition_enabled && d.enabled;
                if (active && !cam.getAttribute('src')) cam.src = '/webcam/stream?t=' + Date.now();
                if (!active && cam.getAttribute('src')) cam.removeAttribute('src');
                cam.style.display = active ? 'block' : 'none';
            } catch (e) {}
        }
        updateCamPreview();
        setInterval(updateCamPreview, 5000);

        // Verschiebbare Kamera-Vorschau (Maus + Touch), Position wird gemerkt
        (function () {
            const cam = document.getElementById('scoreboard-cam');
            const STORAGE_KEY = 'camPreviewPos';
            const clamp = (val, min, max) => Math.max(min, Math.min(max, val));

            function place(x, y) {
                cam.style.right = 'auto';
                cam.style.bottom = 'auto';
                cam.style.left = clamp(x, 0, window.innerWidth - cam.offsetWidth) + 'px';
                cam.style.top = clamp(y, 0, window.innerHeight - cam.offsetHeight) + 'px';
            }

            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
                if (saved) {
                    cam.style.right = 'auto';
                    cam.style.bottom = 'auto';
                    cam.style.left = saved.x + 'px';
                    cam.style.top = saved.y + 'px';
                }
            } catch (e) {}

            cam.addEventListener('pointerdown', function (e) {
                e.preventDefault();
                const r = cam.getBoundingClientRect();
                const offX = e.clientX - r.left, offY = e.clientY - r.top;
                cam.setPointerCapture(e.pointerId);

                function onMove(ev) { place(ev.clientX - offX, ev.clientY - offY); }
                function onUp() {
                    const pos = cam.getBoundingClientRect();
                    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({x: pos.left, y: pos.top})); } catch (e) {}
                    cam.removeEventListener('pointermove', onMove);
                    cam.removeEventListener('pointerup', onUp);
                    cam.removeEventListener('pointercancel', onUp);
                }
                cam.addEventListener('pointermove', onMove);
                cam.addEventListener('pointerup', onUp);
                cam.addEventListener('pointercancel', onUp);
            });
        })();
    </script>
    <script src="/static/js/shutdown.js?v={{ asset_version }}"></script>
</body>
</html>
