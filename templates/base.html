<!DOCTYPE html>
<html lang="{{ current_lang }}" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Padel Scoreboard{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    {% block extra_css %}{% endblock %}
    <script src="/static/js/i18n.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-table-tennis-paddle-ball"></i>
                    <h1 data-i18n="app_title">Padel Scoreboard</h1>
                </div>
                <nav class="main-nav">
                    <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
                        <i class="fas fa-home"></i> <span data-i18n="nav.scoreboard">Scoreboard</span>
                    </a>
                    <a href="/stats" class="nav-link {% if request.url.path == '/stats' %}active{% endif %}">
                        <i class="fas fa-chart-bar"></i> <span data-i18n="nav.stats">Statistik</span>
                    </a>
                    <a href="/settings" class="nav-link {% if request.url.path == '/settings' %}active{% endif %}">
                        <i class="fas fa-video"></i> <span data-i18n="nav.settings">Gesten</span>
                    </a>
                    <a href="/admin" class="nav-link {% if request.url.path == '/admin' %}active{% endif %}">
                        <i class="fas fa-user-cog"></i> <span data-i18n="nav.admin">Admin</span>
                    </a>
                </nav>
                <div class="header-actions">
                    <div class="wifi-status" id="wifiStatusBadge">
                        <i class="fas fa-wifi"></i>
                        <span data-i18n="common.loading">Lade...</span>
                    </div>
                    <button class="btn btn-icon" id="themeToggle" onclick="toggleTheme()">
                        <i class="fas fa-moon"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}{% endblock %}
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <div class="footer-content">
                <div class="footer-left">
                    <span data-i18n="common.version">Padel Scoreboard v1.0</span>
                    <span class="footer-divider">•</span>
                    <span id="currentTime">--:--:--</span>
                </div>
                <div class="footer-right">
                    <a href="/wifi-info" class="footer-link">
                        <i class="fas fa-info-circle"></i> <span data-i18n="nav.wifi_info">WLAN Info</span>
                    </a>
                    <span class="footer-divider">•</span>
                    <span id="connectionStatus" data-i18n="common.connected">Verbunden</span>
                </div>
            </div>
        </footer>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer"></div>

    <!-- Confirm Dialog -->
    <div id="confirmDialog" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="confirmTitle">Bestätigung</h3>
                <button class="modal-close" onclick="closeConfirmDialog()">&times;</button>
            </div>
            <div id="confirmMessage">Sind Sie sicher?</div>
            <div style="display: flex; gap: 0.5rem; margin-top: 1.5rem;">
                <button class="btn btn-secondary" onclick="closeConfirmDialog()">Abbrechen</button>
                <button class="btn btn-danger" id="confirmAction">Bestätigen</button>
            </div>
        </div>
    </div>

    <!-- JavaScript -->
    <script src="/static/js/main.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
