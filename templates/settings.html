<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
    <title>{{ t.nav.settings }} · openPadel</title>
{% include "_head.html" %}
</head>
<body>
{% include "_nav.html" %}

    <main class="page narrow">
        <h1 class="page-title" data-i18n="nav.settings">{{ t.nav.settings }}</h1>

        <div id="status-message" class="status-message"></div>

        <div class="card">
            <h2><svg class="icon"><use href="#i-trophy"/></svg><span data-i18n="settings.match_format">Match-Format</span></h2>
            <div class="segmented">
                <input type="radio" id="bestof1" name="bestof" value="1">
                <label for="bestof1" data-i18n="settings.best_of_1">Best of 1</label>
                <input type="radio" id="bestof3" name="bestof" value="3" checked>
                <label for="bestof3" data-i18n="settings.best_of_3">Best of 3</label>
                <input type="radio" id="bestof5" name="bestof" value="5">
                <label for="bestof5" data-i18n="settings.best_of_5">Best of 5</label>
            </div>
            <div class="note" data-i18n="settings.note_format">
                Hinweis: Diese Einstellung legt fest, wie viele Sätze gewonnen werden müssen.
            </div>
        </div>

        <div class="card">
            <h2><svg class="icon"><use href="#i-ball"/></svg><span data-i18n="settings.game_mode">Spielmodus</span></h2>
            <div class="field">
                <label for="game-mode" data-i18n="settings.rules">Regelwerk</label>
                <select id="game-mode" onchange="saveGameMode()">
                    <option value="mit_vorteil_tiebreak">Mit Vorteil & Tiebreak</option>
                </select>
            </div>
            <p class="muted small" id="game-mode-description"></p>
        </div>

        <div class="card">
            <h2><svg class="icon"><use href="#i-star"/></svg><span data-i18n="settings.team_names">Team-Namen</span></h2>
            <div class="field">
                <label for="team-a-name" class="c-a" data-i18n="settings.team_a_name">Team A Name</label>
                <input type="text" id="team-a-name" placeholder="Team A" value="Team A" maxlength="40">
            </div>
            <div class="field">
                <label for="team-b-name" class="c-b" data-i18n="settings.team_b_name">Team B Name</label>
                <input type="text" id="team-b-name" placeholder="Team B" value="Team B" maxlength="40">
            </div>
            <button class="btn btn-primary block" onclick="saveTeamNames()" data-i18n="settings.save_team_names">Team-Namen speichern</button>
        </div>

        <div class="card">
            <h2><svg class="icon"><use href="#i-refresh"/></svg><span data-i18n="settings.serve">Aufschlag</span></h2>
            <div class="row">
                <span class="label" data-i18n="settings.current_serve">Aktueller Aufschlag</span>
                <span class="value" id="serve-display">Team A</span>
            </div>
            <button class="btn btn-ghost block" onclick="toggleServe()" data-i18n="settings.toggle_serve">Aufschlag wechseln</button>
        </div>

        <a class="btn btn-primary block" href="/" style="margin-top: 20px;">
            <svg class="icon"><use href="#i-ball"/></svg>
            <span data-i18n="settings.to_scoreboard">Zum Scoreboard</span>
        </a>
    </main>

    <script>
        let currentState = null;
        let gameModeDescriptions = {};

        function showGameModeDescription() {
            const id = document.getElementById('game-mode').value;
            document.getElementById('game-mode-description').textContent = gameModeDescriptions[id] || '';
        }

        async function loadSettings() {
            try {
                const response = await fetch('/api/state');
                const data = await response.json();
                currentState = data.state;

                // Best of aus State laden (wird bereits vom Backend berechnet)
                const bestOf = currentState.best_of || 3;
                const radioButton = document.getElementById(`bestof${bestOf}`);
                if (radioButton) {
                    radioButton.checked = true;
                }

                document.getElementById('team-a-name').value = currentState.team_a_name || 'Team A';
                document.getElementById('team-b-name').value = currentState.team_b_name || 'Team B';

                updateServeDisplay();
                
                // Load game modes
                await loadGameModes();
            } catch (error) {
                console.error('Error loading settings:', error);
                showStatus('Fehler beim Laden der Einstellungen', 'error');
            }
        }
        
        async function loadGameModes() {
            try {
                const response = await fetch('/api/game-modes');
                const modes = await response.json();
                const select = document.getElementById('game-mode');
                select.innerHTML = '';
                
                const currentGameMode = currentState?.game_mode || 'mit_vorteil_tiebreak';
                
                modes.forEach(mode => {
                    const option = document.createElement('option');
                    option.value = mode.id;
                    option.textContent = mode.name;
                    option.title = mode.description;
                    if (currentGameMode === mode.id) {
                        option.selected = true;
                    }
                    select.appendChild(option);
                });
                gameModeDescriptions = Object.fromEntries(modes.map(m => [m.id, m.description || '']));
                showGameModeDescription();
            } catch (error) {
                console.error('Error loading game modes:', error);
            }
        }
        
        async function saveGameMode() {
            const gameModeId = document.getElementById('game-mode').value;
            showGameModeDescription();
            
            try {
                const response = await fetch('/api/settings/game-mode', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({game_mode: gameModeId})
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    showStatus('Spielmodus gespeichert', 'success');
                    currentState = data.state;
                } else {
                    showStatus('Fehler beim Speichern', 'error');
                }
            } catch (error) {
                console.error('Error saving game mode:', error);
                showStatus('Fehler beim Speichern des Spielmodus', 'error');
            }
        }

        function updateServeDisplay() {
            const serveName = currentState.serve === 'a' ?
                (currentState.team_a_name || 'Team A') :
                (currentState.team_b_name || 'Team B');
            document.getElementById('serve-display').textContent = serveName;
        }

        async function saveTeamNames() {
            const teamAName = document.getElementById('team-a-name').value.trim();
            const teamBName = document.getElementById('team-b-name').value.trim();

            if (!teamAName || !teamBName) {
                showStatus('Bitte beide Team-Namen eingeben', 'error');
                return;
            }

            try {
                const response = await fetch('/api/settings/teams', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        team_a_name: teamAName,
                        team_b_name: teamBName
                    })
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    showStatus('Team-Namen gespeichert', 'success');
                    currentState = data.state;
                    updateServeDisplay();
                } else {
                    showStatus('Fehler beim Speichern', 'error');
                }
            } catch (error) {
                console.error('Error saving team names:', error);
                showStatus('Fehler beim Speichern der Team-Namen', 'error');
            }
        }

        async function toggleServe() {
            try {
                const response = await fetch('/api/settings/serve', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    showStatus('Aufschlag gewechselt', 'success');
                    currentState = data.state;
                    updateServeDisplay();
                } else {
                    showStatus('Fehler beim Wechseln', 'error');
                }
            } catch (error) {
                console.error('Error toggling serve:', error);
                showStatus('Fehler beim Wechseln des Aufschlags', 'error');
            }
        }

        document.querySelectorAll('input[name="bestof"]').forEach(radio => {
            radio.addEventListener('change', async function() {
                try {
                    const response = await fetch('/api/settings/best-of', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({best_of: parseInt(this.value)})
                    });
                    const data = await response.json();
                    
                    if (data.status === 'success') {
                        showStatus(`Best of ${this.value} aktiviert`, 'success');
                        currentState = data.state;
                    } else {
                        showStatus('Fehler beim Speichern', 'error');
                    }
                } catch (error) {
                    console.error('Error saving best-of:', error);
                    showStatus('Fehler beim Speichern der Einstellung', 'error');
                }
            });
        });

        function showStatus(message, type) {
            const statusMsg = document.getElementById('status-message');
            statusMsg.textContent = message;
            statusMsg.className = 'status-message status-' + type;
            statusMsg.style.display = 'block';
            setTimeout(() => {
                statusMsg.style.display = 'none';
            }, 3000);
        }

        loadSettings();

        setInterval(async () => {
            try {
                const response = await fetch('/api/state');
                const data = await response.json();
                currentState = data.state;
                updateServeDisplay();
            } catch (error) {
                console.error('Error refreshing state:', error);
            }
        }, 2000);
    </script>
    <script src="/static/js/shutdown.js"></script>
</body>
</html>
